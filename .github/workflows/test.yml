# Run the unit test suite on every push/PR. The stress suite (real upstream
# calls) is excluded automatically via the `-m "not stress"` addopts in
# pyproject.toml, so this stays hermetic and fast (<1 min per version).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version the classifiers in pyproject.toml claim to support.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit tests
        run: uv run pytest tests/unit -q

  # The Node bridge (bridge/) has its own tests and dependency audit. This job
  # is separate from `test` above, which has no Node and so proves that the
  # Python side works without the bridge.
  bridge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - name: Install bridge dependencies
        working-directory: bridge
        run: npm ci --ignore-scripts

      - name: Run bridge tests
        working-directory: bridge
        run: npm test

      - name: Audit production dependencies
        working-directory: bridge
        run: npm audit --omit=dev --audit-level=high
